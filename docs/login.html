<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>دخول الإدارة | منصة إبداع الوزية</title>
  <meta name="theme-color" content="#141B4D">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <script src="assets/js/supabase.js" defer></script>
  <script src="config.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a href="./" class="login-brand" aria-label="العودة إلى المنصة">
      <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"><rect x="20" y="20" width="60" height="60" rx="3"/><rect x="20" y="20" width="60" height="60" rx="3" transform="rotate(45 50 50)"/></g><circle cx="50" cy="50" r="11" fill="currentColor"/></svg>
    </a>
    <h1>لوحة تحكم إبداع الوزية</h1>
    <p>خاصة بمسؤولة النشاط الطلابي</p>
    <form id="login-form" novalidate>
      <label class="field">البريد الإلكتروني<input class="input" name="email" type="email" autocomplete="username" required dir="ltr"></label>
      <label class="field">كلمة المرور
        <span class="pw-wrap"><input class="input" name="password" type="password" autocomplete="current-password" required dir="ltr">
        <button type="button" class="pw-toggle" aria-label="إظهار كلمة المرور"><svg class="icon"><use href="assets/icons.svg#i-eye"></use></svg></button></span>
      </label>
      <p class="form-error" role="alert" id="err"></p>
      <button class="btn btn-gold" type="submit" style="width:100%"><svg class="icon"><use href="assets/icons.svg#i-lock"></use></svg> تسجيل الدخول</button>
    </form>
    <form id="reset-form" hidden novalidate>
      <p style="color:var(--ink-2)">اكتبي كلمة مرور جديدة لحسابك.</p>
      <label class="field">كلمة المرور الجديدة<input class="input" name="pw1" type="password" autocomplete="new-password" minlength="8" required dir="ltr"></label>
      <label class="field">تأكيد كلمة المرور<input class="input" name="pw2" type="password" autocomplete="new-password" required dir="ltr"></label>
      <p class="form-error" role="alert" id="err2"></p>
      <button class="btn btn-gold" type="submit" style="width:100%">حفظ كلمة المرور</button>
    </form>
    <button type="button" class="back-link" id="forgot" style="background:none;border:0;cursor:pointer">نسيتِ كلمة المرور؟</button><br>
    <a class="back-link" href="./" style="margin-top:6px">العودة إلى المنصة</a>
  </main>
</body>
</html>
