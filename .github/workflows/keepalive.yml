# يزور قاعدة البيانات كل يومين حتى لا يوقفها Supabase المجاني بسبب عدم النشاط
name: keep-database-awake
on:
  schedule:
    - cron: '17 5 */2 * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" docs/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']+" docs/config.js)
          if [[ "$URL" == YOUR* ]]; then echo "config.js غير معدّ بعد"; exit 0; fi
          curl -fsS "$URL/rest/v1/settings?select=key&limit=1" -H "apikey: $KEY"
      - name: Keep this schedule enabled (GitHub pauses idle schedules after 60 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable" || true
